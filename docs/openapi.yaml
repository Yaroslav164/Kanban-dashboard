openapi: 3.0.3
info:
  title: 'Kanban MVP'
  description: 'First-party SPA on the same origin. Use Accept: application/json, keep cookies, and URL-decode XSRF-TOKEN into X-XSRF-TOKEN for mutations. Timestamps are UTC RFC 3339 strings. Collection endpoints return all active records.'
  version: 0.1.0
servers:
  -
    url: /
paths:
  '/api/boards/{board}':
    get:
      tags:
        - Boards
      summary: 'Read a board'
      operationId: getBoard
      responses:
        '200':
          description: 'Requested resource'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/BoardDetail'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
    delete:
      tags:
        - Boards
      summary: 'Soft-delete a board'
      operationId: deleteBoard
      parameters:
        -
          $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 'Resource and any descendants soft-deleted'
        '401':
          $ref: '#/components/responses/Error401'
        '419':
          $ref: '#/components/responses/Error419'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
    patch:
      tags:
        - Boards
      summary: 'Update a board'
      operationId: updateBoard
      parameters:
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBoard'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Board'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '419':
          $ref: '#/components/responses/Error419'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
    parameters:
      -
        $ref: '#/components/parameters/board'
  '/api/columns/{column}/cards':
    get:
      tags:
        - Cards
      summary: 'List cards'
      operationId: listCards
      responses:
        '200':
          description: 'Collection ordered by position then id ascending'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Card'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
    post:
      tags:
        - Cards
      summary: 'Create a card'
      operationId: createCard
      parameters:
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCard'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Card'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '419':
          $ref: '#/components/responses/Error419'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
    parameters:
      -
        $ref: '#/components/parameters/column'
  '/api/columns/{column}/cards/{card}':
    get:
      tags:
        - Cards
      summary: 'Read a card'
      operationId: getCard
      responses:
        '200':
          description: 'Requested resource'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Card'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
    delete:
      tags:
        - Cards
      summary: 'Soft-delete a card'
      operationId: deleteCard
      parameters:
        -
          $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 'Resource and any descendants soft-deleted'
        '401':
          $ref: '#/components/responses/Error401'
        '419':
          $ref: '#/components/responses/Error419'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
    patch:
      tags:
        - Cards
      summary: 'Update a card'
      operationId: updateCard
      parameters:
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCard'
      responses:
        '409':
          description: 'An original field value differs from the current card'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Updated
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Card'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '419':
          $ref: '#/components/responses/Error419'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
    parameters:
      -
        $ref: '#/components/parameters/column'
      -
        $ref: '#/components/parameters/card'
  '/api/cards/{card}/move':
    post:
      tags:
        - Cards
      summary: 'Reorder or move a card'
      description: 'Both neighbor keys are required. Evaluate neighbors in the target column after excluding the moving card. Null previous means first, null next means last, both null require an empty target. Non-null neighbors must be distinct and differ from the moving card (422). Unknown or inaccessible card or target column returns 404. A different accessible board or a stale destination gap returns 409. Repeating the same move succeeds while its neighbors still match. The server assigns position.'
      operationId: moveCard
      parameters:
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCard'
      responses:
        '200':
          description: 'Moved card'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Card'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '419':
          $ref: '#/components/responses/Error419'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
    parameters:
      -
        $ref: '#/components/parameters/card'
  '/api/boards/{board}/columns':
    get:
      tags:
        - Columns
      summary: 'List columns'
      operationId: listColumns
      responses:
        '200':
          description: 'Collection ordered by position then id ascending'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Column'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
    post:
      tags:
        - Columns
      summary: 'Create a column'
      operationId: createColumn
      parameters:
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateColumn'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Column'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '419':
          $ref: '#/components/responses/Error419'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
    parameters:
      -
        $ref: '#/components/parameters/board'
  '/api/boards/{board}/columns/{column}':
    get:
      tags:
        - Columns
      summary: 'Read a column'
      operationId: getColumn
      responses:
        '200':
          description: 'Requested resource'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Column'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
    delete:
      tags:
        - Columns
      summary: 'Soft-delete a column'
      operationId: deleteColumn
      parameters:
        -
          $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 'Resource and any descendants soft-deleted'
        '401':
          $ref: '#/components/responses/Error401'
        '419':
          $ref: '#/components/responses/Error419'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
    patch:
      tags:
        - Columns
      summary: 'Update a column'
      operationId: updateColumn
      parameters:
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchColumn'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Column'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '419':
          $ref: '#/components/responses/Error419'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
    parameters:
      -
        $ref: '#/components/parameters/board'
      -
        $ref: '#/components/parameters/column'
  /sanctum/csrf-cookie:
    get:
      tags:
        - Auth
      summary: 'Initialize CSRF cookies'
      operationId: csrfCookie
      responses:
        '204':
          description: 'Cookies initialized'
          headers:
            Set-Cookie:
              description: 'Initializes XSRF-TOKEN and the browser session. Preserve all Set-Cookie headers.'
              schema:
                type: string
      security: []
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: 'Register and start a session'
      operationId: authRegister
      parameters:
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                type: object
                additionalProperties: false
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
      security: []
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: 'Start a session'
      operationId: authLogin
      parameters:
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      responses:
        '200':
          description: 'Current user'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                type: object
                additionalProperties: false
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
      security: []
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: 'End the current session'
      operationId: authLogout
      parameters:
        -
          $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 'Logged out'
        '401':
          $ref: '#/components/responses/Error401'
        '419':
          $ref: '#/components/responses/Error419'
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: 'Read current user'
      operationId: authMe
      responses:
        '200':
          description: 'Current user'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
  /auth/github/redirect:
    get:
      tags:
        - Auth
      summary: 'Start GitHub sign-in or link the signed-in account'
      description: 'Socialite stores a single-use state, intent and initiating user in the session. Linking requires intent=link and the same authenticated user at callback.'
      operationId: startGithubOAuth
      parameters:
        -
          name: intent
          in: query
          required: false
          schema:
            type: string
            default: login
            enum:
              - login
              - link
      responses:
        '302':
          description: 'Redirect to the GitHub authorization page requesting read:user and user:email.'
          headers:
            Location:
              description: 'Navigation destination.'
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
      security: []
  /auth/github/callback:
    get:
      tags:
        - Auth
      summary: 'Complete a state-validated GitHub sign-in or link'
      description: 'Known provider IDs sign in to the linked account. A new account requires a verified primary email. Existing emails never cause implicit account linking. Explicit linking requires the initiating session and an unclaimed provider ID. Rotate the session on sign-in. Errors redirect with one of invalid_state, denied, email_unverified, account_exists, identity_in_use or provider_unavailable. All redirect locations are fixed SPA paths.'
      operationId: finishGithubOAuth
      parameters:
        -
          name: code
          in: query
          required: false
          schema:
            type: string
        -
          name: state
          in: query
          required: false
          schema:
            type: string
        -
          name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: 'Successful login or link redirects to /boards. Errors redirect to /login?oauth={error} for sign-in, /settings/account?oauth={error} for a verified link attempt. If state cannot be validated use /login?oauth=invalid_state.'
          headers:
            Location:
              description: 'Navigation destination.'
              schema:
                type: string
      security: []
  '/api/boards/{board}/members':
    get:
      tags:
        - 'Board members'
      summary: 'List board members'
      operationId: listBoardMembers
      parameters:
        -
          $ref: '#/components/parameters/board'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BoardMember'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
    post:
      tags:
        - 'Board members'
      summary: 'Add a registered user to the board'
      operationId: addBoardMember
      parameters:
        -
          $ref: '#/components/parameters/board'
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                role:
                  type: string
                  pattern: '^(editor|viewer|custom-[1-9][0-9]*)$'
                  maxLength: 40
              type: object
              additionalProperties: false
      responses:
        '201':
          description: 'Member added'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/BoardMember'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
  '/api/boards/{board}/members/{member}':
    delete:
      tags:
        - 'Board members'
      summary: 'Remove a board member'
      operationId: deleteBoardMember
      parameters:
        -
          $ref: '#/components/parameters/board'
        -
          name: member
          in: path
          description: 'Member user ID'
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        -
          $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 'Member removed'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
    patch:
      tags:
        - 'Board members'
      summary: 'Change a board member role'
      operationId: updateBoardMember
      parameters:
        -
          $ref: '#/components/parameters/board'
        -
          name: member
          in: path
          description: 'Member user ID'
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - role
              properties:
                role:
                  type: string
                  pattern: '^(editor|viewer|custom-[1-9][0-9]*)$'
                  maxLength: 40
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/BoardMember'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
  '/api/boards/{board}/roles':
    get:
      tags:
        - 'Board roles'
      summary: 'List custom roles'
      operationId: listBoardRoles
      parameters:
        -
          $ref: '#/components/parameters/board'
      responses:
        '200':
          description: 'List custom roles'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomRole'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
    post:
      tags:
        - 'Board roles'
      summary: 'Create a custom role'
      operationId: createBoardRole
      parameters:
        -
          $ref: '#/components/parameters/board'
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '201':
          description: 'Create a custom role'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CustomRole'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
  '/api/boards/{board}/roles/{role}':
    delete:
      tags:
        - 'Board roles'
      summary: 'Remove an unassigned custom role'
      operationId: deleteBoardRole
      parameters:
        -
          $ref: '#/components/parameters/board'
        -
          name: role
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        -
          $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 'Remove an unassigned custom role'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
    patch:
      tags:
        - 'Board roles'
      summary: 'Change a custom role'
      operationId: updateBoardRole
      parameters:
        -
          $ref: '#/components/parameters/board'
        -
          name: role
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      responses:
        '200':
          description: 'Change a custom role'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CustomRole'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
  /api/boards:
    get:
      tags:
        - Boards
      summary: 'List boards'
      operationId: listBoards
      responses:
        '200':
          description: 'Collection ordered by id ascending'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Board'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
    post:
      tags:
        - Boards
      summary: 'Create a board'
      operationId: createBoard
      parameters:
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoard'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Board'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
  '/api/cards/{card}/activity':
    get:
      tags:
        - Cards
