        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
    post:
      tags:
        - Cards
      summary: 'Save a board card as a reusable template'
      description: 'Requires cards.create. Takes a snapshot of the title, description, labels and checklists.'
      operationId: saveCardTemplate
      parameters:
        -
          $ref: '#/components/parameters/board'
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - card_id
                - name
              properties:
                card_id:
                  type: integer
                  format: int64
                  minimum: 1
                name:
                  type: string
                  maxLength: 255
                  minLength: 1
              type: object
              additionalProperties: false
      responses:
        '201':
          description: 'Saved template'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/CardTemplate'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
  '/api/columns/{column}/cards/from-template':
    post:
      tags:
        - Cards
      summary: 'Append a card using a template from the same board'
      description: 'Requires cards.create. Checklist and item identifiers are new and every item starts unchecked.'
      operationId: createCardFromTemplate
      parameters:
        -
          $ref: '#/components/parameters/column'
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - template_id
              properties:
                template_id:
                  type: integer
                  format: int64
                  minimum: 1
              type: object
              additionalProperties: false
      responses:
        '201':
          description: 'Created card'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Card'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
  '/api/cards/{card}/history':
    get:
      tags:
        - Cards
      summary: 'List the 100 latest changes to a card'
      operationId: listCardHistory
      parameters:
        -
          $ref: '#/components/parameters/card'
      responses:
        '200':
          description: 'Card history'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CardHistoryEntry'
                    maxItems: 100
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
  /api/me/notifications:
    get:
      tags:
        - Notifications
      summary: 'List inbox notifications with unread entries first'
      description: 'Returns up to 100 private notifications for cards still accessible to the signed-in user. Deadline reminders cover today and tomorrow (application time zone).'
      operationId: listMyNotifications
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BoardNotification'
                    maxItems: 100
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
  '/api/me/notifications/{notification}/read':
    post:
      tags:
        - Notifications
      summary: 'Mark a notification as read'
      operationId: readMyNotification
      parameters:
        -
          name: notification
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        -
          $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 'Notification marked as read'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '419':
          $ref: '#/components/responses/Error419'
  /api/me/tasks:
    get:
      tags:
        - Cards
      summary: "List the current user's incomplete assigned cards across accessible boards"
      operationId: listMyTasks
      responses:
        '200':
          description: 'Active tasks ordered by due date, then id'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssignedTask'
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
  /api/broadcasting/auth:
    post:
      tags:
        - Realtime
      summary: 'Authorize a Laravel Reverb private user channel'
      operationId: authorizePrivateChannel
      parameters:
        -
          $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - socket_id
                - channel_name
              properties:
                socket_id:
                  type: string
                  pattern: ^\d+\.\d+$
                channel_name:
                  type: string
                  pattern: ^private-users\.\d+$
              type: object
              additionalProperties: false
      responses:
        '200':
          description: 'Pusher protocol channel signature'
          content:
            application/json:
              schema:
                required:
                  - auth
                properties:
                  auth:
                    type: string
                type: object
                additionalProperties: false
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '419':
          $ref: '#/components/responses/Error419'
        '422':
          $ref: '#/components/responses/Error422'
components:
  schemas:
    BoardMember:
      required:
        - id
        - name
        - email
        - role
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/BoardRoleKey'
      type: object
      additionalProperties: false
    BoardRoleKey:
      type: string
      pattern: '^(owner|editor|viewer|custom-[1-9][0-9]*)$'
    Permissions:
      type: array
      items:
        type: string
        enum:
          - board.rename
          - columns.create
          - columns.edit
          - columns.delete
          - cards.create
          - cards.edit
          - cards.move
          - cards.delete
          - cards.comment
          - cards.attach
      maxItems: 10
      uniqueItems: true
    RoleInput:
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          maxLength: 80
          minLength: 1
        permissions:
          $ref: '#/components/schemas/Permissions'
      type: object
      additionalProperties: false
    CustomRole:
      required:
        - id
        - key
        - name
        - permissions
      properties:
        id:
          type: integer
          minimum: 1
        key:
          type: string
          pattern: '^custom-[1-9][0-9]*$'
        name:
          type: string
          maxLength: 80
          minLength: 1
        permissions:
          $ref: '#/components/schemas/Permissions'
      type: object
      additionalProperties: false
    CardLabel:
      required:
        - name
        - color
      properties:
        name:
          type: string
          maxLength: 50
          minLength: 1
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
      type: object
      additionalProperties: false
    CardChecklistItem:
      required:
        - id
        - title
        - completed
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 255
          minLength: 1
        completed:
          type: boolean
      type: object
      additionalProperties: false
    CardChecklist:
      required:
        - id
        - title
        - items
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 255
          minLength: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/CardChecklistItem'
          maxItems: 100
      type: object
      additionalProperties: false
    CardCommentAuthor:
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
      type: object
      nullable: true
      additionalProperties: false
    CardComment:
      required:
        - id
        - body
        - author
        - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        body:
          type: string
          maxLength: 10000
          minLength: 1
        author:
          $ref: '#/components/schemas/CardCommentAuthor'
        created_at:
          type: string
          format: date-time
      type: object
      additionalProperties: false
    CardAttachment:
      required:
        - id
        - name
        - mime_type
        - size
        - created_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        mime_type:
          type: string
        size:
          type: integer
          maximum: 10485760
          minimum: 1
        created_at:
          type: string
          format: date-time
      type: object
      additionalProperties: false
    CardActivity:
      required:
        - comments
        - attachments
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/CardComment'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/CardAttachment'
      type: object
      additionalProperties: false
    ArchivedCard:
      required:
        - id
        - title
        - column_id
        - column_title
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          maxLength: 255
          minLength: 1
        column_id:
          type: integer
          format: int64
          minimum: 1
        column_title:
          type: string
          maxLength: 255
          minLength: 1
      type: object
      additionalProperties: false
    CardTemplate:
      required:
        - id
        - name
        - title
        - description
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          maxLength: 255
          minLength: 1
        title:
          type: string
          maxLength: 255
          minLength: 1
        description:
          type: string
          nullable: true
          maxLength: 10000
      type: object
      additionalProperties: false
    CardHistoryEntry:
      required:
        - id
        - kind
        - detail
        - actor_name
        - created_at
      properties:
        id:
          type: integer
          minimum: 1
        kind:
          type: string
          enum:
            - moved
            - start_date
            - due_date
            - assignees
            - completed
            - reopened
        detail:
          type: string
          nullable: true
        actor_name:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      type: object
      additionalProperties: false
    BoardNotification:
      required:
        - id
        - kind
        - board_id
        - card_id
        - card_title
        - read
        - created_at
      properties:
        id:
          type: integer
          minimum: 1
        kind:
          type: string
          enum:
            - assigned
            - mentioned
            - due_soon
        board_id:
          type: integer
          minimum: 1
        card_id:
          type: integer
          minimum: 1
        card_title:
          type: string
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
      type: object
      additionalProperties: false
    AssignedTask:
      required:
        - id
        - title
        - board_id
        - board_title
        - column_id
        - column_title
        - due_date
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        board_id:
          type: integer
          format: int64
        board_title:
          type: string
        column_id:
          type: integer
          format: int64
        column_title:
          type: string
        due_date:
          type: string
          format: date
          nullable: true
      type: object
      additionalProperties: false
    User:
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          maxLength: 255
          minLength: 1
        email:
          type: string
          format: email
          maxLength: 255
      type: object
      additionalProperties: false
    Login:
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          description: 'At most 72 UTF-8 bytes, without NUL characters.'
          type: string
          format: password
          writeOnly: true
      type: object
      additionalProperties: false
    Registration:
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
        email:
          type: string
          format: email
          maxLength: 255
        password:
          description: 'At most 72 UTF-8 bytes, without NUL characters.'
          type: string
          format: password
          writeOnly: true
          minLength: 8
        password_confirmation:
          type: string
          format: password
          writeOnly: true
      type: object
      additionalProperties: false
    Board:
      required:
        - id
        - title
        - created_at
        - updated_at
        - role
        - permissions
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          maxLength: 255
          minLength: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        role:
          $ref: '#/components/schemas/BoardRoleKey'
        permissions:
          $ref: '#/components/schemas/Permissions'
      type: object
      additionalProperties: false
    Column:
      required:
        - id
        - title
        - created_at
        - updated_at
        - board_id
        - position
        - wip_limit
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          maxLength: 255
          minLength: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        board_id:
          type: integer
          format: int64
          minimum: 1
        position:
          type: integer
          format: int32
          minimum: 1
        wip_limit:
          type: integer
          format: int32
          nullable: true
          maximum: 2147483647
          minimum: 1
      type: object
      additionalProperties: false
    Card:
      required:
        - id
        - title
        - created_at
        - updated_at
        - column_id
        - description
        - position
        - start_date
        - due_date
        - completed
        - labels
        - assignee_ids
        - checklists
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          maxLength: 255
          minLength: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        column_id:
          type: integer
          format: int64
          minimum: 1
        description:
          type: string
          nullable: true
          maxLength: 10000
        position:
          type: number
          format: double
        start_date:
          type: string
          format: date
          nullable: true
        due_date:
          description: 'On or after start_date'
          type: string
          format: date
          nullable: true
        completed:
          type: boolean
        labels:
